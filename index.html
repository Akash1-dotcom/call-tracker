<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Call Tracker</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; --mut:#8b949e; --acc:#238636; --acc2:#2ea043; --amb:#9e6a03; --amb2:#bb8009; --dan:#da3633; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
    max-width:520px; margin:0 auto;
  }
  header { display:flex; align-items:center; justify-content:space-between; padding:18px 0 8px; }
  h1 { font-size:18px; margin:0; letter-spacing:.3px; }
  .date { color:var(--mut); font-size:13px; }
  .hero { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px 20px; text-align:center; }
  .mood { font-size:42px; line-height:1; margin-bottom:8px; }
  .big { font-size:72px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
  .lbl { color:var(--mut); font-size:13px; text-transform:uppercase; letter-spacing:1px; margin-top:8px; }
  .split { display:flex; gap:10px; margin-top:18px; }
  .sp { flex:1; background:#0d1117; border:1px solid var(--line); border-radius:10px; padding:10px 6px; }
  .sp b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .sp span { font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; }
  .sp.c b { color:var(--acc2); }
  .sp.n b { color:var(--amb2); }
  .goalwrap { margin-top:16px; }
  .bar { height:8px; background:#21262d; border-radius:99px; overflow:hidden; }
  .fill { height:100%; background:var(--acc2); width:0; transition:width .25s; }
  .goaltxt { color:var(--mut); font-size:12px; margin-top:6px; display:flex; justify-content:space-between; }
  .goaltxt input { width:56px; background:#21262d; border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:2px 6px; font-size:12px; text-align:center; }
  button { font:inherit; border:none; border-radius:14px; cursor:pointer; color:#fff; }
  button:active { transform:scale(.97); }
  .logs { display:flex; gap:10px; margin-top:16px; }
  .logs button { flex:1; padding:22px 10px; font-size:17px; font-weight:600; line-height:1.25; }
  .logs button small { display:block; font-size:11px; font-weight:400; opacity:.8; margin-top:4px; letter-spacing:.4px; }
  #conn { background:var(--acc); }
  #noconn { background:var(--amb); }
  .row { display:flex; gap:10px; margin-top:10px; }
  .row button { flex:1; padding:14px; font-size:14px; background:var(--card); border:1px solid var(--line); color:var(--fg); }
  .row .undo { color:#f0a5a5; }
  .stats { display:flex; gap:10px; margin-top:18px; }
  .stat { flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center; }
  .stat b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .streak { margin-top:10px; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; text-align:center; }
  .streak b { color:var(--amb2); font-size:20px; }
  .streak span { color:var(--mut); font-size:12px; margin-left:4px; }
  .notify { width:100%; margin-top:10px; padding:12px; background:var(--card); border:1px solid var(--line); color:var(--fg); font-size:13px; }
  .notify.enabled { color:var(--acc2); }
  .modal { position:fixed; inset:0; display:flex; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.65); padding:16px; z-index:10; }
  .modal[hidden] { display:none; }
  .sheet { width:100%; max-width:520px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; }
  .sheet h3 { margin:0 0 14px; font-size:18px; }
  .choice { display:block; width:100%; padding:16px; margin-top:10px; background:#21262d; border:1px solid var(--line); color:var(--fg); text-align:left; font-size:16px; }
  .cancel { display:block; width:100%; padding:13px; margin-top:10px; background:transparent; color:var(--mut); font-size:14px; }
  label { display:block; color:var(--mut); font-size:12px; margin:10px 0 5px; text-transform:uppercase; letter-spacing:.5px; }
  input, textarea, select { width:100%; background:#0d1117; border:1px solid var(--line); color:var(--fg); border-radius:10px; padding:12px; font:inherit; }
  textarea { min-height:74px; resize:vertical; }
  .save { width:100%; padding:14px; margin-top:12px; background:var(--acc); font-weight:600; }
  .followups { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .frow { padding:13px 14px; border-bottom:1px solid var(--line); }
  .frow:last-child { border-bottom:none; }
  .frow b { display:block; font-size:15px; }
  .frow p { margin:4px 0 10px; color:var(--mut); font-size:13px; }
  .fmeta { color:var(--amb2); font-size:12px; margin-top:3px; }
  .factions { display:flex; gap:8px; }
  .factions a, .factions button { flex:1; text-align:center; text-decoration:none; border-radius:10px; padding:10px 8px; font-size:13px; }
  .factions a { background:var(--acc); color:#fff; }
  .factions button { background:#21262d; border:1px solid var(--line); color:var(--fg); }
  h2 { font-size:13px; color:var(--mut); text-transform:uppercase; letter-spacing:1px; margin:26px 0 8px; }
  .hist { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .hrow { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--line); font-size:14px; }
  .hrow:last-child { border-bottom:none; }
  .hrow .d { color:var(--mut); }
  .hrow .v { display:flex; gap:10px; align-items:baseline; font-variant-numeric:tabular-nums; }
  .hrow .v .g { color:var(--acc2); font-size:13px; }
  .hrow .v .a { color:var(--amb2); font-size:13px; }
  .hrow .v .t { font-weight:600; min-width:28px; text-align:right; }
  .empty { padding:16px; color:var(--mut); font-size:14px; text-align:center; }
  footer { margin:22px 0 8px; text-align:center; }
  footer button { background:none; color:var(--dan); font-size:13px; padding:8px; }
</style>
</head>
<body>
<header>
  <h1>📞 Call Tracker</h1>
  <div class="date" id="today"></div>
</header>

<div class="hero">
  <div class="mood" id="mood" aria-label="Call progress mood">😢</div>
  <div class="big" id="count">0</div>
  <div class="lbl">Total calls dialed today</div>
  <div class="split">
    <div class="sp c"><b id="tConn">0</b><span>Connected</span></div>
    <div class="sp n"><b id="tNo">0</b><span>Not connected</span></div>
    <div class="sp"><b id="tRate">—</b><span>Connect rate</span></div>
  </div>
  <div class="goalwrap">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="goaltxt">
      <span id="pct">0%</span>
      <span>Goal <input id="goal" type="number" min="1" inputmode="numeric"></span>
    </div>
  </div>
</div>

<div class="logs">
  <button id="conn">✅ Connected<small>Reached someone</small></button>
  <button id="noconn">📵 Not connected<small>No answer / VM</small></button>
</div>
<div class="row">
  <button class="undo" id="undoConn">↺ Undo connected</button>
  <button class="undo" id="undoNo">↺ Undo not conn.</button>
</div>

<div class="stats">
  <div class="stat"><b id="week">0</b><span>This week</span></div>
  <div class="stat"><b id="total">0</b><span>All time</span></div>
  <div class="stat"><b id="avg">0</b><span>Daily avg</span></div>
</div>
<div class="streak"><b id="streak">1 day</b><span>daily login streak 🔥</span></div>
<button class="notify" id="notify">🔔 Enable 45-minute reminders</button>

<h2>Email follow-ups</h2>
<div class="followups" id="followups"></div>

<h2>Last 7 days</h2>
<div class="hist" id="hist"></div>

<footer><button id="reset">Reset all data</button></footer>

<div class="modal" id="outcomeModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <div id="choices"></div>
    <button class="cancel" id="cancelOutcome">Cancel</button>
  </div>
</div>

<div class="modal" id="emailModal" hidden>
  <form class="sheet" id="emailForm">
    <h3>Email follow-up</h3>
    <label for="fName">Name</label>
    <input id="fName" autocomplete="name" placeholder="Contact name">
    <label for="fCompany">Company</label>
    <input id="fCompany" autocomplete="organization" placeholder="Company">
    <label for="fEmail">Email</label>
    <input id="fEmail" type="email" autocomplete="email" placeholder="person@company.com">
    <label for="fNotes">What to send</label>
    <textarea id="fNotes" placeholder="Pricing info, case study, recap..."></textarea>
    <label for="fDue">Due</label>
    <select id="fDue">
      <option value="today">Today</option>
      <option value="tomorrow">Tomorrow</option>
      <option value="custom">Custom / later</option>
    </select>
    <button class="save" type="submit">Save follow-up</button>
    <button class="cancel" id="cancelEmail" type="button">Cancel</button>
  </form>
</div>

<script>
const KEY = 'callTracker.v1';
const blank = () => ({ c:0, n:0, m:0, e:0, cr:0, cnr:0, na:0, vm:0, wn:0, bs:0 });
const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayKey = () => key(new Date());
const isWeekday = d => d.getDay() > 0 && d.getDay() < 6;
const previousWeekday = d => {
  const previous = new Date(d);
  do { previous.setDate(previous.getDate() - 1); } while (!isWeekday(previous));
  return previous;
};

function load() {
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { raw = {}; }
  const db = { days:{}, goal: raw.goal || 50, streak: raw.streak || 0, lastActive: raw.lastActive || '', followups: raw.followups || [] };
  // migrate old schemas to detailed outcomes
  for (const [k, v] of Object.entries(raw.days || {})) {
    if (typeof v === 'number') db.days[k] = { ...blank(), n:v, legacy:true };
    else {
      const d = blank();
      d.c = v.c || 0;
      d.n = v.n || 0;
      d.m = v.m || 0;
      d.e = v.e || 0;
      d.cr = v.cr || 0;
      d.cnr = v.cnr || 0;
      d.na = v.na || 0;
      d.vm = v.vm || 0;
      d.wn = v.wn || 0;
      d.bs = v.bs || 0;
      db.days[k] = d;
    }
  }
  const today = todayKey();
  if (isWeekday(new Date()) && db.lastActive !== today) {
    const previous = previousWeekday(new Date());
    db.streak = db.lastActive === key(previous) ? db.streak + 1 : 1;
    db.lastActive = today;
    localStorage.setItem(KEY, JSON.stringify(db));
  }
  return db;
}
let db = load();
const save = () => localStorage.setItem(KEY, JSON.stringify(db));

const get = k => db.days[k] || blank();
const tot = o => o.c + o.n;
const REMINDER_MS = 45 * 60 * 1000;

function updateToday(updates) {
  const k = todayKey();
  const day = db.days[k] || blank();
  for (const [field, delta] of Object.entries(updates)) {
    day[field] = Math.max(0, (day[field] || 0) + delta);
  }
  delete day.legacy;
  if (tot(day) === 0) delete db.days[k]; else db.days[k] = day;
  save(); render();
  if (Object.values(updates).some(delta => delta > 0) && navigator.vibrate) navigator.vibrate(15);
}
function add(field, delta) { updateToday({ [field]: delta }); }

function render() {
  const t = new Date();
  document.getElementById('today').textContent =
    t.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });

  const d0 = get(todayKey());
  const c = tot(d0);
  document.getElementById('mood').textContent = c >= 30 ? '😄' : c >= 20 ? '🙂' : '😢';
  document.getElementById('count').textContent = c;
  document.getElementById('tConn').textContent = d0.c;
  document.getElementById('tNo').textContent = d0.n;
  document.getElementById('tRate').textContent = c ? Math.round(d0.c / c * 100) + '%' : '—';

  const goal = db.goal || 50;
  document.getElementById('goal').value = goal;
  const pct = Math.min(100, Math.round(c / goal * 100));
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('pct').textContent = pct + '% of goal';

  let week = 0;
  const rows = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(t); d.setDate(t.getDate() - i);
    const o = get(key(d));
    week += tot(o);
    rows.push({ d, o });
  }
  const all = Object.values(db.days);
  const total = all.reduce((a, b) => a + tot(b), 0);

  document.getElementById('week').textContent = week;
  document.getElementById('total').textContent = total;
  document.getElementById('avg').textContent = all.length ? Math.round(total / all.length) : 0;
  document.getElementById('streak').textContent = `${db.streak} ${db.streak === 1 ? 'day' : 'days'}`;
  const notify = document.getElementById('notify');
  const enabled = 'Notification' in window &&
    localStorage.getItem('callTracker.reminders') === 'on' &&
    Notification.permission === 'granted';
  notify.textContent = enabled ? '🔔 45-minute reminders enabled' : '🔔 Enable 45-minute reminders';
  notify.classList.toggle('enabled', enabled);

  const openFollowups = (db.followups || []).filter(f => !f.sent);
  document.getElementById('followups').innerHTML = openFollowups.length
    ? openFollowups.map(f => {
        const subject = encodeURIComponent(`Follow-up from our call${f.company ? ` - ${f.company}` : ''}`);
        const body = encodeURIComponent(f.notes || '');
        const emailHref = escapeHtml(f.email || '');
        return `<div class="frow">
          <b>${escapeHtml(f.name || 'Unnamed contact')}${f.company ? ` · ${escapeHtml(f.company)}` : ''}</b>
          <div class="fmeta">Due: ${escapeHtml(f.dueLabel)}${f.email ? ` · ${escapeHtml(f.email)}` : ''}</div>
          ${f.notes ? `<p>${escapeHtml(f.notes)}</p>` : ''}
          <div class="factions">
            <a href="mailto:${emailHref}?subject=${subject}&body=${body}">Open email</a>
            <button data-sent="${f.id}">Mark sent</button>
          </div>
        </div>`;
      }).join('')
    : '<div class="empty">No email follow-ups yet.</div>';
  document.querySelectorAll('[data-sent]').forEach(button => {
    button.onclick = () => markFollowupSent(button.dataset.sent);
  });

  const shown = rows.filter(r => tot(r.o) > 0);
  document.getElementById('hist').innerHTML = shown.length
    ? shown.map(r => `<div class="hrow">
        <span class="d">${r.d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'})}</span>
        <span class="v"><span class="g">${r.o.c} conn</span><span class="a">${r.o.n} no</span><span class="t">${tot(r.o)}</span></span>
      </div>`).join('')
    : '<div class="empty">No calls logged yet — hit a button above.</div>';
}

const outcomeModal = document.getElementById('outcomeModal');
const choices = document.getElementById('choices');
const emailModal = document.getElementById('emailModal');
function showOutcomes(title, options, onSelect) {
  document.getElementById('modalTitle').textContent = title;
  choices.innerHTML = options.map(option => `<button class="choice" data-field="${option.field}">${option.label}</button>`).join('');
  choices.querySelectorAll('.choice').forEach(button => {
    button.onclick = () => { outcomeModal.hidden = true; onSelect(button.dataset.field); };
  });
  outcomeModal.hidden = false;
}
document.getElementById('conn').onclick = () => showOutcomes('Connected outcome', [
  { field:'cr', label:'👤 Right person (conversation)' },
  { field:'cnr', label:'↪️ Not the right person' },
  { field:'ref', label:'🤝 Referred someone' },
  { field:'m', label:'📅 Meeting booked' },
  { field:'email', label:'✉️ Asked for email' }
], field => {
  if (field === 'm') updateToday({ c:1, m:1 });
  else if (field === 'email') { updateToday({ c:1, e:1 }); showEmailForm(); }
  else if (field === 'ref') updateToday({ c:1 });
  else updateToday({ c:1, [field]:1 });
});
document.getElementById('noconn').onclick = () => showOutcomes('Not connected outcome', [
  { field:'na', label:'🔕 No answer' },
  { field:'vm', label:'📨 Voicemail' },
  { field:'wn', label:'❌ Wrong number' },
  { field:'bs', label:'📵 Busy' }
], field => updateToday({ n:1, [field]:1 }));
document.getElementById('cancelOutcome').onclick = () => { outcomeModal.hidden = true; };
outcomeModal.onclick = event => { if (event.target === outcomeModal) outcomeModal.hidden = true; };
document.getElementById('undoConn').onclick = () => add('c', -1);
document.getElementById('undoNo').onclick   = () => add('n', -1);
document.getElementById('goal').onchange = e => {
  db.goal = Math.max(1, parseInt(e.target.value, 10) || 50);
  save(); render();
};
document.getElementById('reset').onclick = () => {
  if (confirm('Delete all call history and reset streak?')) {
    const now = new Date();
    db = { days:{}, goal:db.goal, streak:isWeekday(now) ? 1 : 0, lastActive:isWeekday(now) ? todayKey() : '', followups:[] };
    save(); render();
  }
};

function dueLabel(value) {
  if (value === 'today') return 'Today';
  if (value === 'tomorrow') return 'Tomorrow';
  return 'Custom / later';
}

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[char]));
}

function showEmailForm() {
  document.getElementById('emailForm').reset();
  emailModal.hidden = false;
  document.getElementById('fName').focus();
}

document.getElementById('emailForm').onsubmit = event => {
  event.preventDefault();
  const due = document.getElementById('fDue').value;
  db.followups = db.followups || [];
  db.followups.unshift({
    id: String(Date.now()),
    name: document.getElementById('fName').value.trim(),
    company: document.getElementById('fCompany').value.trim(),
    email: document.getElementById('fEmail').value.trim(),
    notes: document.getElementById('fNotes').value.trim(),
    due,
    dueLabel: dueLabel(due),
    createdAt: new Date().toISOString(),
    sent: false
  });
  save();
  emailModal.hidden = true;
  render();
};
document.getElementById('cancelEmail').onclick = () => { emailModal.hidden = true; };
emailModal.onclick = event => { if (event.target === emailModal) emailModal.hidden = true; };

function markFollowupSent(id) {
  db.followups = (db.followups || []).map(f => f.id === id ? { ...f, sent:true, sentAt:new Date().toISOString() } : f);
  save();
  render();
}

document.getElementById('notify').onclick = async () => {
  if (!('Notification' in window)) {
    alert('Browser notifications are not supported here.');
    return;
  }
  const permission = Notification.permission === 'granted'
    ? 'granted'
    : await Notification.requestPermission();
  if (permission !== 'granted') {
    alert('Please allow notifications in your browser settings to enable reminders.');
    return;
  }
  localStorage.setItem('callTracker.reminders', 'on');
  localStorage.setItem('callTracker.lastReminderAt', String(Date.now()));
  render();
};

function checkReminder() {
  if (!('Notification' in window)) return;
  if (localStorage.getItem('callTracker.reminders') !== 'on' || Notification.permission !== 'granted') return;
  const last = Number(localStorage.getItem('callTracker.lastReminderAt') || Date.now());
  if (Date.now() - last < REMINDER_MS) return;
  new Notification('Call Tracker', { body:'45 minutes have passed. Ready for your next calls?' });
  localStorage.setItem('callTracker.lastReminderAt', String(Date.now()));
}

let day = todayKey();
setInterval(() => { if (todayKey() !== day) { day = todayKey(); render(); } }, 30000);
setInterval(checkReminder, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { db = load(); render(); } });

render();
</script>
</body>
</html>
